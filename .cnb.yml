# CNB (Cloud Native Build) 配置文件
# 用于自动化构建、测试和部署流程

$:
  vscode:
    - docker:
        # 使用 Node.js 24 镜像作为开发环境
        image: node:24
        services:
          - vscode
          - docker
        stages:
          - name: 初始化环境
            script: ls -al
          - name: 安装依赖
            script: npm install
          - name: 类型检查
            script: npm run lint
          - name: 启动开发服务器
            script: npm run dev

# 主分支推送触发
main:
  push:
    - docker:
        image: node:24
        # 挂载 npm 缓存以加速构建
        volumes:
          - /root/.npm:cow
        stages:
          - name: 安装依赖
            script: npm install
          - name: 类型检查
            script: npm run lint
          - name: 构建项目
            script: npm run build
          - name: 生成 Code Wiki
            timeout: 4h
            image: cnbcool/codewiki:latest
            settings:
              git_doc_dir: /${CNB_BUILD_WORKSPACE}/${CNB_REPO_SLUG}/codewiki

# Pull Request 触发
pull_request:
  - docker:
      image: node:24
      volumes:
        - /root/.npm:cow
      stages:
        - name: 安装依赖
          script: npm install
        - name: 类型检查
          script: npm run lint
        - name: 构建项目
          script: npm run build
